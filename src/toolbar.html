<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'"><title>ScreenBrush tools</title><link rel="stylesheet" href="toolbar.css"></head><body><main><header><span class="dot"></span><strong>ScreenBrush</strong><span>DRAW ON YOUR SCREEN</span><span class="drag">⠿</span><button data-action="quit" title="Quit (Ctrl/Cmd+Shift+Q)">×</button></header><nav aria-label="Drawing tools"><button data-tool="pen" class="active" title="Brush (B)">✎</button><button data-tool="line" title="Line (L)">╱</button><button data-tool="arrow" title="Arrow (A)">↗</button><button data-tool="rectangle" title="Rectangle (R)">▭</button><button data-tool="ellipse" title="Ellipse (O)">◯</button><button data-tool="text" title="Text (T)">T</button><button data-tool="eraser" title="Eraser (E)">⌫</button><button data-tool="laser" title="Fading laser pointer (P)">⌁</button><button data-tool="spotlight" title="Spotlight (S)">◉</button><i></i><input id="color" type="color" value="#ff526c" aria-label="Brush color"><button class="swatch" data-color="#ffcb47" style="--color:#ffcb47" title="Yellow"></button><button class="swatch" data-color="#66e3b4" style="--color:#66e3b4" title="Mint"></button><button class="swatch" data-color="#70b7ff" style="--color:#70b7ff" title="Blue"></button><input id="width" type="range" min="2" max="40" value="5" aria-label="Brush width"><i></i><button data-action="undo" title="Undo (Ctrl/Cmd+Z)">↶</button><button data-action="redo" title="Redo (Ctrl/Cmd+Shift+Z)">↷</button><button data-action="whiteboard" title="Whiteboard (W)">▣</button><button data-action="save" title="Export transparent PNG (Ctrl/Cmd+S)">⇩</button><button data-action="clear" title="Clear all">⌧</button><button data-action="ghost" id="ghost" title="Click through (Ctrl/Cmd+Shift+D)">☝</button></nav></main><script src="toolbar.js"></script><script src="shortcuts.js"></script></body></html>
